name: Build DLStore IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project DLStore.xcodeproj \
            -scheme DLStore \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="${PWD}/build" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r ./build/DLStore.app Payload/
          zip -r DLStore.ipa Payload
          ls -lh DLStore.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DLStore-IPA
          path: DLStore.ipa